<!DOCTYPE html>
<html>

<title>Emma's Epic TODO List!!!</title>

<link rel = "stylesheet" href = "css/main.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
<head>
    
</head>
<body>
<div class = "container">
    <div class = "todo-app">
        <h2><img src = "css/images/butterflyright.gif" alt="blue butterfly"> To-Do List <img src = "css/images/butterflyright.gif" alt="blue butterfly"></h2>
        <div class = "row">
            <input type = "text" id = "input-box" placeholder = "Task...">
            <input type = "text" id = "due-date" placeholder = "MM/DD/YYYY"
                   inputmode = "numeric" maxlength = "10"
                   pattern = "\d{2}/\d{2}/\d{4}">
        </div>

        <button onclick = "addTask()">Add</button>
        
        <h3> Tasks:</h3>
        <ul id = "list-container">
        </ul>
    </div>
</div>
<script src = "js/main.js"></script>
</body>

</html>
